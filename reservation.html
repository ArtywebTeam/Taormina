<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenotazione · Taormina Ristorante Pizzeria</title>
  <meta name="description" content="Prenota un tavolo al Ristorante Pizzeria Taormina a Gardone Val Trompia. Cucina di mare e pizza cotta nel forno a legna.">
  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpeg">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand-link">
        <img src="assets/images/logo.jpeg" alt="Taormina Logo" class="brand-logo">
        <span class="brand-name">TAORMINA</span>
      </a>

      <div class="header-actions">
        <button class="control-btn" id="lang-toggle-btn" onclick="toggleLanguage()" aria-label="Cambia lingua" type="button">EN</button>
        <button class="control-btn" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Cambia tema" type="button">
          <span id="theme-icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN RESERVATION CONTENT ==================== -->
  <main class="form-page-container">
    <div class="form-page-inner">
      
      <!-- Back to restaurant link -->
      <a href="index.html" class="back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
        </svg>
        <span data-i18n="reservation_back">Torna al ristorante</span>
      </a>

      <!-- Page Header -->
      <div style="margin-bottom: 3rem; border-bottom: 1px solid var(--color-border-subtle); padding-bottom: 2.5rem;">
        <p class="eyebrow" data-i18n="reservation_eyebrow">Prenotazione</p>
        <h1 class="heading" data-i18n="reservation_heading">Il tuo tavolo ti aspetta.</h1>
        <p class="body-copy" style="margin-top: 1rem;" data-i18n="reservation_desc">Invia la richiesta: ti contatteremo per confermare la disponibilità.</p>
      </div>

      <!-- Form Container -->
      <div id="form-wrapper">
        <form class="reservation-form-grid" id="reservation-form">
          <!-- Full Name -->
          <div class="form-group">
            <label for="full_name" data-i18n="form_fullname">Nome e cognome</label>
            <input type="text" id="full_name" name="full_name" required placeholder="Mario Rossi">
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label for="phone" data-i18n="form_phone">Telefono</label>
            <input type="tel" id="phone" name="phone" required placeholder="+39 340 123 4567">
          </div>

          <!-- Email (Optional) -->
          <div class="form-group">
            <label for="email">
              <span data-i18n="form_email">Email</span> 
              <span style="opacity: 0.6;" data-i18n="form_optional">(facoltativa)</span>
            </label>
            <input type="email" id="email" name="email" placeholder="mario.rossi@email.it">
          </div>

          <!-- Number of Guests -->
          <div class="form-group">
            <label for="guests" data-i18n="form_guests">Numero di ospiti</label>
            <input type="number" id="guests" name="guests" min="1" value="2" required>
          </div>

          <!-- Date -->
          <div class="form-group">
            <label for="date" data-i18n="form_date">Data</label>
            <input type="date" id="date" name="date" required>
          </div>

          <!-- Time -->
          <div class="form-group">
            <label for="time" data-i18n="form_time">Ora</label>
            <input type="time" id="time" name="time" value="19:30" required>
          </div>

          <!-- Special Requests -->
          <div class="form-group col-span-2">
            <label for="special_requests" data-i18n="form_requests">Richieste speciali</label>
            <textarea id="special_requests" name="special_requests" rows="4" placeholder="Allergie, tavolo all'aperto, seggiolone bimbo, compleanno..."></textarea>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="cta-primary" style="grid-column: 1 / -1; width: 100%;" id="submit-btn" data-i18n="form_submit">Invia la richiesta</button>
        </form>
      </div>

      <!-- Confirmation Stamp (Shown after submission) -->
      <div class="stamp" id="confirmation-stamp" style="display: none;">
        <span class="stamp-icon">✓</span>
        <h2 data-i18n="stamp_success_title">Richiesta inviata</h2>
        <p data-i18n="stamp_success_desc">Grazie! La tua prenotazione è stata inviata. Ti contatteremo presto per confermare.</p>
        <a href="index.html" class="cta-primary" style="margin-top: 2rem;" data-i18n="reservation_back">Torna al ristorante</a>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/translations.js"></script>
  <script src="js/main.js"></script>
  <script src="js/reservation.js"></script>
</body>
</html>
