<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina non trovata · Taormina</title>
  <link rel="icon" type="image/jpeg" href="assets/images/logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand-link">
        <img src="assets/images/logo.jpeg" alt="Taormina Logo" class="brand-logo">
        <span class="brand-name">TAORMINA</span>
      </a>

      <div class="header-actions">
        <button class="control-btn" id="lang-toggle-btn" onclick="toggleLanguage()" aria-label="Cambia lingua" type="button">EN</button>
        <button class="control-btn" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Cambia tema" type="button">
          <span id="theme-icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 404 CONTENT ==================== -->
  <main class="error-page-container">
    <div style="max-width: 28rem; width: 100%;">
      <div class="error-404-number">404</div>
      <div class="error-divider"></div>
      
      <h1 class="heading" style="font-size: 2rem; margin-top: 1rem;" data-i18n="error_title">Pagina non trovata</h1>
      <p class="body-copy" style="margin: 1rem auto 2rem;" data-i18n="error_desc">La pagina che stai cercando non esiste o è stata spostata.</p>
      
      <a href="index.html" class="cta-primary" data-i18n="error_home">Torna alla home</a>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/translations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
